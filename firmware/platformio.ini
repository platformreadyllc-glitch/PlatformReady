[platformio]
; Without this, a bare `pio run`/`pio run --target upload` (no -e flag —
; e.g. the VSCode PlatformIO "Upload" button) tries to process every
; environment below, including [env:native] (host-only unit tests, not a
; flashable target). Scope default builds/uploads to the real board;
; native tests stay opt-in via `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Assumes standard 4MB flash. min_spiffs.csv gives two ~1.9MB OTA app slots
; (ota_0/ota_1) + otadata, required for OTA updates (see firmware/README.md).
board_build.partitions = min_spiffs.csv
build_flags =
    -Wno-cpp
upload_port = COM3
monitor_port = COM3
lib_deps =
    khoih-prog/Ethernet_Generic@^2.8.1
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.1
    olikraus/U8g2@^2.36.5
    arduino-libraries/ArduinoHttpClient@^0.6.1
    links2004/WebSockets@^2.4.1

; Host-compiled unit tests for the pure logic pulled out of the
; Arduino/ESP32-dependent code (see firmware/test/README.md). No hardware
; needed: `pio test -e native`. Only the listed dependency-free files are
; compiled in — everything else in src/ touches Arduino/ESP32 APIs that
; don't exist on the host.
[env:native]
platform = native
test_build_src = true
build_src_filter = -<*> +<version_compare.cpp> +<host_port.cpp> +<url_utils.cpp>
build_flags = -std=c++11
; See scripts/native_toolchain.py — requires a one-time
; `pio pkg install -g -t platformio/toolchain-gccmingw32` on Windows, and
; statically links the test binary's MinGW runtime (see script for why).
extra_scripts = pre:scripts/native_toolchain.py
