[platformio]
; Without this, a bare `pio run`/`pio run --target upload` (no -e flag —
; e.g. the VSCode PlatformIO "Upload" button) tries to process every
; environment below, including [env:native] (host-only unit tests, not a
; flashable target). Scope default builds/uploads to the real board;
; native tests stay opt-in via `pio test -e native`.
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Assumes standard 4MB flash. min_spiffs.csv gives two ~1.9MB OTA app slots
; (ota_0/ota_1) + otadata, required for OTA updates (see firmware/README.md).
board_build.partitions = min_spiffs.csv
build_flags =
    -Wno-cpp
    ; NETWORK_CUSTOM=10 (WebSockets.h) - routes WebSocketsClient through our
    ; own ws_network_client.cpp instead of a hardcoded WiFiClient, so the WS
    ; connection follows whichever transport network.cpp's networkIsEthernet()
    ; currently reports. Literal 10 (not the symbolic NETWORK_CUSTOM name),
    ; matching the library's own CustomNetworkClient example - the symbolic
    ; name isn't in scope yet at the point this command-line define is
    ; substituted.
    -DWEBSOCKETS_NETWORK_TYPE=10
upload_port = COM3
monitor_port = COM3
lib_deps =
    khoih-prog/Ethernet_Generic@^2.8.1
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.1
    olikraus/U8g2@^2.36.5
    arduino-libraries/ArduinoHttpClient@^0.6.1
    ; Pinned to a specific commit rather than the registry package
    ; (links2004/WebSockets@^2.4.1) - the published "2.7.3" registry
    ; snapshot is missing WebSocketsNetworkClientSecure::setCertificate()/
    ; setPrivateKey(), which WebSocketsClient.cpp needs to compile at all
    ; under WEBSOCKETS_NETWORK_TYPE=NETWORK_CUSTOM on ESP32 (dead code at
    ; runtime here - this project never sets a client cert/key - but still
    ; has to link). Confirmed present as of this commit on GitHub's master.
    https://github.com/Links2004/arduinoWebSockets.git#e3edca4907e8524856fbc38a6bb00eb6073c982e

; Host-compiled unit tests for the pure logic pulled out of the
; Arduino/ESP32-dependent code (see firmware/test/README.md). No hardware
; needed: `pio test -e native`. Only the listed dependency-free files are
; compiled in — everything else in src/ touches Arduino/ESP32 APIs that
; don't exist on the host.
[env:native]
platform = native
test_build_src = true
build_src_filter = -<*> +<version_compare.cpp> +<host_port.cpp> +<url_utils.cpp> +<scoreboard.cpp> +<transport_fsm.cpp>
build_flags = -std=c++11
; See scripts/native_toolchain.py — requires a one-time
; `pio pkg install -g -t platformio/toolchain-gccmingw32` on Windows, and
; statically links the test binary's MinGW runtime (see script for why).
extra_scripts = pre:scripts/native_toolchain.py
